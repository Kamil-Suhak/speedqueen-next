name: Sync Google Reviews Snapshot

on:
  schedule:
    # Runs at 03:00 UTC on the 1st and 15th of each month (bi-weekly)
    - cron: '0 3 1,15 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  sync-reviews:
    name: Sync Google Reviews & Ratings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Sync Google Reviews Snapshot
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACEID_ORLINSKIEGO: "ChIJXw81dFBbFkcR37QA2sxXPU0"
          NEXT_PUBLIC_GOOGLE_PLACEID_PAWIA: "ChIJ5zIcehhbFkcRg5JAJS7ICZo"
          NEXT_PUBLIC_GOOGLE_PLACEID_SLOWACKIEGO: "ChIJLzFV3tFbFkcRri72hyj1PCI"
        run: npm run reviews:sync

      - name: Commit & Push Snapshot if Changed
        run: |
          if [ -n "$(git status --porcelain src/data/reviews.json)" ]; then
            echo "Changes detected in reviews snapshot. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/reviews.json
            git commit -m "chore: update google reviews snapshot"
            git push origin dev
          else
            echo "No changes detected in reviews snapshot."
          fi
